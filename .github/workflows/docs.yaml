name: Docs

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'feature/isaacsim-6-0'
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Build Fern Docs
    runs-on: ubuntu-latest
    env:
      FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
      REPO_NAME: ${{ secrets.REPO_NAME }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'develop' || github.ref }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: "24"

    - name: Set up Fern CLI
      uses: fern-api/setup-fern-cli@v1

    - name: Install documentation converter
      run: |
        uv venv
        uv pip install -r docs/requirements.txt

    - name: Generate guide pages
      run: .venv/bin/python tools/docs/build_fern.py

    - name: Generate source API
      working-directory: ./fern
      run: fern docs md generate --local

    - name: Validate Fern configuration
      working-directory: ./fern
      run: fern check

    - name: Publish pull request preview
      if: github.event_name == 'pull_request' && env.FERN_TOKEN != ''
      working-directory: ./fern
      run: fern generate --docs --preview --id "pr-${{ github.event.pull_request.number }}"

    - name: Publish production documentation
      if: >-
        env.FERN_TOKEN != '' &&
        github.repository == env.REPO_NAME &&
        (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      working-directory: ./fern
      run: fern generate --docs
